<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Interview Feedback</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#FFFFFF;color:#111827;padding:20px}
h1{font-size:22px;font-weight:800;margin-bottom:16px}
.login{max-width:360px;margin:80px auto;text-align:center}
.login input{width:100%;padding:12px;border:1.5px solid #E7ECF3;border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:0}
.login input:focus{border-color:#2F88FF}
.login button{width:100%;padding:12px;background:#2F88FF;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#FFFFFF;border:1.5px solid #E7ECF3;border-radius:12px;padding:16px;text-align:center}
.stat .n{font-size:28px;font-weight:800}
.stat .l{font-size:11px;color:#6b7280;margin-top:2px}
.card{background:#FFFFFF;border:1.5px solid #E7ECF3;border-radius:12px;padding:16px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card .rating{font-size:20px}
.card .time{font-size:11px;color:#6b7280}
.card .meta{font-size:12px;color:#5B6472;margin-bottom:6px}
.card .text{font-size:13px;color:#111827;background:#FFFFFF;padding:10px;border-radius:8px;margin-top:8px}
.empty{text-align:center;padding:40px;color:#6b7280}
#dash{display:none}
.refresh{padding:8px 16px;background:#f3f4f6;border:1px solid #E7ECF3;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:16px}
</style><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet"><style>h1,h2,.logo-text,.logo b{font-family:'Inter',system-ui,sans-serif !important}</style><style id="zk-hover">.card,.tool-card,.cat-card,.feat,.post-card,.trust-card,.how-card,.sample-card,.upgrade-card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,border-color .25s ease}.card:hover,.tool-card:hover,.cat-card:hover,.feat:hover,.post-card:hover,.trust-card:hover,.how-card:hover,.sample-card:hover,.upgrade-card:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(26,26,24,.13)}.card-icon,.feat-ic{transition:transform .3s cubic-bezier(.2,.8,.2,1)}.card:hover .card-icon{transform:scale(1.09) rotate(-4deg)}</style><style id="zk-lucien-forms">input,textarea,select{background:#FFFFFF!important;color:#374151!important;border-color:#E7ECF3}input::placeholder,textarea::placeholder{color:#8A93A3}select option{background:#FFFFFF;color:#374151}</style></head><body>

<div class="login" id="loginBox">
<h1>Admin Access</h1>
<p style="font-size:13px;color:#6b7280;margin-bottom:16px">Enter admin key to view feedback</p>
<input type="password" id="keyInp" placeholder="Admin Key" onkeydown="if(event.key==='Enter')doLogin()">
<button onclick="doLogin()">View Feedback</button>
</div>

<div id="dash">
<h1>Interview Feedback Dashboard</h1>
<button class="refresh" onclick="loadFeedback()">Refresh</button>
<div class="stats" id="statsGrid"></div>
<div id="feedList"></div>
</div>

<script>
var adminKey='';

function doLogin(){
  adminKey=document.getElementById('keyInp').value.trim();
  if(!adminKey){alert('Enter admin key');return}
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').style.display='block';
  loadFeedback();
}

async function loadFeedback(){
  try{
    var r=await fetch('/api/interview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminFeedback',key:adminKey})});
    var d=await r.json();
    if(!d.feedback){document.getElementById('feedList').innerHTML='<div class="empty">Invalid key or no access</div>';return}
    
    var fb=d.feedback.reverse();
    var total=fb.length;
    var avgRating=total?Math.round(fb.reduce(function(s,f){return s+f.rating},0)/total*10)/10:0;
    var avgScore=total?Math.round(fb.reduce(function(s,f){return s+f.score},0)/total):0;
    var fiveStars=fb.filter(function(f){return f.rating===5}).length;
    
    document.getElementById('statsGrid').innerHTML=
      '<div class="stat"><div class="n">'+total+'</div><div class="l">Total Feedback</div></div>'+
      '<div class="stat"><div class="n">'+avgRating+'</div><div class="l">Avg Rating /5</div></div>'+
      '<div class="stat"><div class="n">'+avgScore+'%</div><div class="l">Avg Interview Score</div></div>'+
      '<div class="stat"><div class="n">'+fiveStars+'</div><div class="l">5-Star Ratings</div></div>';
    
    if(!total){document.getElementById('feedList').innerHTML='<div class="empty">No feedback yet. Feedback will appear here after users complete interviews.</div>';return}
    
    function fc(m){return "<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.14em'><circle cx='12' cy='12' r='10'/><circle cx='9' cy='10' r='0.6' fill='currentColor' stroke='none'/><circle cx='15' cy='10' r='0.6' fill='currentColor' stroke='none'/>"+m+"</svg>"}
    var stars=['',fc("<path d='M16 16s-1.5-2-4-2-4 2-4 2'/>"),fc("<line x1='8.5' y1='15' x2='15.5' y2='15'/>"),fc("<path d='M8 14s1.5 2 4 2 4-2 4-2'/>"),fc("<path d='M8 13.5s1.5 2.5 4 2.5 4-2.5 4-2.5'/>"),fc("<path d='M7 13s2 3.5 5 3.5 5-3.5 5-3.5'/>")];
    var html='';
    fb.forEach(function(f){
      html+='<div class="card"><div class="top"><div class="rating">'+(stars[f.rating]||'')+ ' '+f.rating+'/5</div><div class="time">'+new Date(f.time).toLocaleString()+'</div></div>';
      html+='<div class="meta"><strong>'+f.role+'</strong>'+(f.company?' at '+f.company:'')+ ' — Score: '+f.score+'%</div>';
      if(f.name||f.phone)html+='<div class="meta" style="color:#2F88FF"><svg width=\'1em\' height=\'1em\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'1.9\' stroke-linecap=\'round\' stroke-linejoin=\'round\' style=\'vertical-align:-0.14em\'><path d=\'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\'/><circle cx=\'12\' cy=\'7\' r=\'4\'/></svg> '+(f.name||'Anonymous')+' | <svg width=\'1em\' height=\'1em\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'1.9\' stroke-linecap=\'round\' stroke-linejoin=\'round\' style=\'vertical-align:-0.14em\'><rect x=\'5\' y=\'2\' width=\'14\' height=\'20\' rx=\'2\'/><line x1=\'12\' y1=\'18\' x2=\'12.01\' y2=\'18\'/></svg> '+(f.phone||'No phone')+'</div>';
      if(f.text)html+='<div class="text">'+f.text+'</div>';
      html+='</div>';
    });
    document.getElementById('feedList').innerHTML=html;
  }catch(e){document.getElementById('feedList').innerHTML='<div class="empty">Error loading feedback: '+e.message+'</div>'}
}
</script>
<script src="/mega.js" defer></script></body></html>
